<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 64 64">
  <!-- Homefoil: a house split like a pair of controllers, the door between them. -->
  <defs>
    <clipPath id="left"><rect width="30.6" height="64"/></clipPath>
    <clipPath id="right"><rect x="33.4" width="30.6" height="64"/></clipPath>
    <mask id="door">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="25" y="38.5" width="14" height="30" rx="5" fill="#000"/>
    </mask>
    <path id="house" d="M32 8.5 L8.5 29 V55.5 H55.5 V29 Z" stroke-width="6" stroke-linejoin="round"/>
  </defs>
  <g mask="url(#door)">
    <use href="#house" clip-path="url(#left)" fill="#00C3E3" stroke="#00C3E3"/>
    <use href="#house" clip-path="url(#right)" fill="#FF4554" stroke="#FF4554"/>
  </g>
</svg>
